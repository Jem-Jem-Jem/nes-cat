<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NES-cat</title>
    <link rel="icon" href="data:,">   <!-- stops the browser's favicon 404 -->

    <!-- NES.css framework + its recommended font, Press Start 2P -->
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- The React shell mounts here. It renders <Canvas>, <Hud> and <Gate>,
         which is the markup that used to be hand-written below. -->
    <div id="root"></div>

    <!-- THE SIZE TOGGLE. A SIBLING of #root, deliberately, and not a
         descendant. ReactDOM.createRoot() owns #root and its subtree and
         nothing else, so a sibling is invisible to React in both directions:
         React will not render it or reconcile it away, and it reads nothing
         from the shell. The two can move independently while the migration
         runs. Inside the tree it could only have been a leaf that owns
         nothing, and its label would have had to go through the store, which
         is the text ownership App.js reserves for later. It is wired by
         scale.js (see setScale there), which is also what keeps the label,
         the URL and the pixels from disagreeing. -->
    <button id="scale-toggle" class="scale-toggle" type="button"
            aria-pressed="false" title="switch between 320x180 and 640x360">320x180</button>

    <!-- React, the piece, and then p5 — and the ORDER IS THE CONTRACT.
         React mounts synchronously (see js/react/mount.js) so that #stage
         exists before p5 boots. p5 in global mode calls window.setup as soon
         as the document is ready, and sketch.js's setup does
         `createCanvas(...).parent('stage')`. If React rendered asynchronously
         the canvas would have nothing to parent to.

         React is loaded from a CDN as UMD, exactly like p5 is below, so the
         project keeps its no-build property: `npm start` still just serves the
         directory, and there is still no node_modules and no bundler. -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <script src="js/react/h.js"></script>
    <script src="js/react/store.js"></script>
    <script src="js/react/App.js"></script>
    <script src="js/react/mount.js"></script>

    <!-- p5 first, then the piece: order matters (see README).
         Both libraries load from a CDN at the exact versions this was built
         against, so they match the CDN-sourced NES.css above and no vendor
         copies need to live in the repo. -->
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>

    <script src="js/config.js"></script>
    <!-- The room at two resolutions. ADDITIVE: it defines NESCAT.room and
         nothing reads it yet. Loaded here so that "the game still runs at
         320x180" is a real test of this file rather than a vacuous one — an
         unloaded file cannot break the piece precisely because it is not
         loaded, which is not evidence of anything. Phase 4 is what switches
         the game to the doubled room. -->
    <script src="js/room.js"></script>
    <script src="js/palette.js"></script>
    <script src="js/frames.js"></script>
    <!-- The 64x64 sets. Loaded ALWAYS, not conditionally: the 32x32 set stays
         exactly as it is and is still what the piece uses with no ?scale=. -->
    <script src="js/frames64.js"></script>
    <script src="js/objects64.js"></script>
    <script src="js/sprite.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/shiro.js"></script>
    <!-- THE SWITCH: ?scale=2 runs at 640x360 with the 64x64 art. Must load
         AFTER scene.js and shiro.js (it doubles their constants) and BEFORE
         sketch.js, whose setup() calls Scene.init() and Shiro.init() - the only
         window in which swapping the frame table and the geometry takes
         effect, since both bind them at init time rather than at load time. -->
    <script src="js/scale.js"></script>
    <script src="js/input.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ui.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
