<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NES-cat</title>
    <link rel="icon" href="data:,">   <!-- stops the browser's favicon 404 -->

    <!-- NES.css framework + its recommended font, Press Start 2P -->
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- The React shell mounts here. It renders <Canvas>, <Hud> and <Gate>,
         which is the markup that used to be hand-written below. -->
    <div id="root"></div>

    <!-- React, the piece, and then p5 — and the ORDER IS THE CONTRACT.
         React mounts synchronously (see js/react/mount.js) so that #stage
         exists before p5 boots. p5 in global mode calls window.setup as soon
         as the document is ready, and sketch.js's setup does
         `createCanvas(...).parent('stage')`. If React rendered asynchronously
         the canvas would have nothing to parent to.

         React is loaded from a CDN as UMD, exactly like p5 is below, so the
         project keeps its no-build property: `npm start` still just serves the
         directory, and there is still no node_modules and no bundler. -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <script src="js/react/h.js"></script>
    <script src="js/react/store.js"></script>
    <script src="js/react/App.js"></script>
    <script src="js/react/mount.js"></script>

    <!-- p5 first, then the piece: order matters (see README).
         Both libraries load from a CDN at the exact versions this was built
         against, so they match the CDN-sourced NES.css above and no vendor
         copies need to live in the repo. -->
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>

    <script src="js/config.js"></script>
    <script src="js/palette.js"></script>
    <script src="js/frames.js"></script>
    <script src="js/sprite.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/shiro.js"></script>
    <script src="js/input.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ui.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
